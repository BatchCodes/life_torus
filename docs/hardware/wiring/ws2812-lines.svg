  <text x="20" y="430" text-anchor="start" font-size="11" fill="#555">Pin 14 (VCC) to the 5 V bus, pin 7 and pins 1, 4, 10, 13 (OE) to GND, 100 nF from 14 to 7.</text>
  <text x="20" y="447" text-anchor="start" font-size="11" fill="#555">Each panel: DIN on the input connector, DOUT on the output connector. The last DOUT of a line stays free.</text>
  <text x="20" y="464" text-anchor="start" font-size="11" fill="#555">N panels split in ring order: N / 4 on each line, and the first lines get one more. 1 to 3 lines also work.</text>
  <text x="20" y="481" text-anchor="start" font-size="11" fill="#555">Connect the GND of each panel to the GND bus (Fig 6). The data lines need a common GND.</text>
