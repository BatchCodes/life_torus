<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- SPDX-License-Identifier: GPL-3.0-or-later -->
  <title>Life Torus wiring: signal chain, controller and USB-C power</title>
  <rect x="0" y="0" width="1100" height="700" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- Mode button -->
  <rect x="226" y="330" width="62" height="50" rx="6" fill="#f3eefb" stroke="#6a1b9a" stroke-width="2"/>
  <text x="257" y="350" text-anchor="middle" font-size="11" font-weight="bold">Mode</text>
  <text x="257" y="364" text-anchor="middle" font-size="11" font-weight="bold">button</text>
  <text x="257" y="377" text-anchor="middle" font-size="9">GPIO7 to G</text>
  <line x1="220" y1="355" x2="226" y2="355" stroke="#6a1b9a" stroke-width="3"/>

  <!-- Optional microphone -->
  <rect x="10" y="450" width="128" height="70" rx="6" fill="#e8f4f8" stroke="#2a7a8a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="74" y="470" text-anchor="middle" font-weight="bold" font-size="12">INMP441 mic</text>
  <text x="74" y="486" text-anchor="middle" font-size="10">(optional)</text>
  <text x="74" y="502" text-anchor="middle" font-size="10">SCK 4, WS 5, SD 6</text>
  <text x="74" y="515" text-anchor="middle" font-size="10">3V3, L/R to G</text>
  <line x1="74" y1="450" x2="74" y2="430" stroke="#2a7a8a" stroke-width="3"/>

  <!-- USB-C power inputs -->
  <rect x="20" y="20" width="190" height="55" rx="6" fill="#fff4d6" stroke="#9a6b00" stroke-width="2"/>
  <text x="115" y="43" text-anchor="middle" font-weight="bold">USB-C input 1</text>
  <text x="115" y="62" text-anchor="middle" font-size="11">5 V 3 A, 5.1 kΩ on CC1 and CC2</text>
  <rect x="20" y="85" width="190" height="55" rx="6" fill="#fffaea" stroke="#9a6b00" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="115" y="108" text-anchor="middle" font-weight="bold">USB-C input 2 (optional)</text>
  <text x="115" y="127" text-anchor="middle" font-size="11">more current for higher brightness</text>
  <!-- One Schottky diode per input -->
  <g stroke="#c45500" stroke-width="3" fill="none">
    <path d="M210 40 H 262"/>
    <path d="M286 40 H 340 V 50 H 372"/>
    <path d="M408 50 H 450"/>
    <path d="M210 105 H 262"/>
    <path d="M286 105 H 340 V 50"/>
  </g>
  <polygon points="262,30 262,50 282,40" fill="#c45500"/>
  <line x1="284" y1="28" x2="284" y2="52" stroke="#c45500" stroke-width="3"/>
  <polygon points="262,95 262,115 282,105" fill="#c45500"/>
  <line x1="284" y1="93" x2="284" y2="117" stroke="#c45500" stroke-width="3"/>
  <text x="273" y="20" text-anchor="middle" font-size="11">SB560</text>
  <!-- Power switch -->
  <circle cx="374" cy="50" r="3" fill="#c45500"/>
  <circle cx="406" cy="50" r="3" fill="#c45500"/>
  <line x1="374" y1="50" x2="403" y2="36" stroke="#c45500" stroke-width="3"/>
  <text x="390" y="28" text-anchor="middle" font-size="11">power switch</text>
  <text x="273" y="135" text-anchor="middle" font-size="11">SB560</text>
  <g stroke="#333" stroke-width="3" fill="none">
    <path d="M210 62 H 235 V 127 H 210"/>
    <path d="M235 80 H 360 V 100 H 450"/>
  </g>
  <text x="395" y="93" text-anchor="middle" font-size="11">GND</text>
  <text x="115" y="158" text-anchor="middle" font-size="11">power bank or USB-C wall charger</text>

  <!-- Distribution -->
  <rect x="450" y="30" width="200" height="40" rx="5" fill="#ffe7cc" stroke="#c45500" stroke-width="2"/>
  <text x="550" y="55" text-anchor="middle" font-weight="bold">5 V lever connector</text>
  <rect x="450" y="80" width="200" height="40" rx="5" fill="#e6e6e6" stroke="#333" stroke-width="2"/>
  <text x="550" y="105" text-anchor="middle" font-weight="bold">GND lever connector</text>
      <text x="400" y="140" text-anchor="middle" font-size="11">1.0 mm²</text>

  <!-- Injection branches -->
  <g stroke-width="3" fill="none">
    <path d="M650 45 H 700 V 160" stroke="#c45500"/>
    <path d="M650 105 H 690 V 160" stroke="#333"/>
  </g>
  <text x="760" y="40" font-size="12">4 branches, 0.5 mm²,</text>
  <text x="760" y="56" font-size="12">one to each pair of boards</text>
  <text x="760" y="72" font-size="12">(boards 1–2, 3–4, 5–6, 7–8),</text>
  <text x="760" y="88" font-size="12">with 1000 µF at each</text>

  <!-- Boards -->
  <g font-size="13">
    <rect x="300" y="200" width="90" height="250" rx="4" fill="#f7d9d9" stroke="#8b1a1a" stroke-width="2"/>
    <rect x="400" y="200" width="90" height="250" rx="4" fill="#f7d9d9" stroke="#8b1a1a" stroke-width="2"/>
    <rect x="500" y="200" width="90" height="250" rx="4" fill="#f7d9d9" stroke="#8b1a1a" stroke-width="2"/>
    <rect x="600" y="200" width="90" height="250" rx="4" fill="#f7d9d9" stroke="#8b1a1a" stroke-width="2"/>
    <rect x="700" y="200" width="90" height="250" rx="4" fill="#f7d9d9" stroke="#8b1a1a" stroke-width="2"/>
    <rect x="800" y="200" width="90" height="250" rx="4" fill="#f7d9d9" stroke="#8b1a1a" stroke-width="2"/>
    <rect x="900" y="200" width="90" height="250" rx="4" fill="#f7d9d9" stroke="#8b1a1a" stroke-width="2"/>
    <rect x="1000" y="200" width="90" height="250" rx="4" fill="#f7d9d9" stroke="#8b1a1a" stroke-width="2"/>
    <text x="345" y="330" text-anchor="middle" font-weight="bold">Board 1</text>
    <text x="445" y="330" text-anchor="middle" font-weight="bold">Board 2</text>
    <text x="545" y="330" text-anchor="middle" font-weight="bold">Board 3</text>
    <text x="645" y="330" text-anchor="middle" font-weight="bold">Board 4</text>
    <text x="745" y="330" text-anchor="middle" font-weight="bold">Board 5</text>
    <text x="845" y="330" text-anchor="middle" font-weight="bold">Board 6</text>
    <text x="945" y="330" text-anchor="middle" font-weight="bold">Board 7</text>
    <text x="1045" y="330" text-anchor="middle" font-weight="bold">Board 8</text>
    <text x="335" y="350" text-anchor="middle" font-size="10">4 × MAX7219</text>
    <text x="345" y="440" text-anchor="middle" font-size="11">IN (bottom)</text>
    <text x="345" y="216" text-anchor="middle" font-size="11">OUT (top)</text>
  </g>

  <!-- Power to boards -->
  <g stroke="#c45500" stroke-width="3" fill="none">
    <path d="M700 160 H 345 V 200"/>
    <path d="M700 160 V 175 H 545 V 200"/>
    <path d="M700 160 H 745 V 200"/>
    <path d="M700 160 H 945 V 200"/>
  </g>
  <text x="352" y="190" font-size="11" fill="#c45500">5 V and GND (pair of wires) to the IN header</text>

  <!-- Chain: DOUT to next DIN -->
  <g stroke="#1f5fa8" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M375 205 C 395 190, 395 470, 415 445"/>
    <path d="M475 205 C 495 190, 495 470, 515 445"/>
    <path d="M575 205 C 595 190, 595 470, 615 445"/>
    <path d="M675 205 C 695 190, 695 470, 715 445"/>
    <path d="M775 205 C 795 190, 795 470, 815 445"/>
    <path d="M875 205 C 895 190, 895 470, 915 445"/>
    <path d="M975 205 C 995 190, 995 470, 1015 445"/>
  </g>
  <text x="545" y="485" text-anchor="middle" fill="#1f5fa8" font-size="12">Jumper from the OUT header (top) of each board to the IN header (bottom) of the next board:</text>
  <text x="545" y="502" text-anchor="middle" fill="#1f5fa8" font-size="12">DOUT → DIN, CLK → CLK, CS → CS. VCC and GND only inside a pair (1–2, 3–4, 5–6, 7–8).</text>

  <!-- 74AHCT125 -->
  <rect x="120" y="540" width="170" height="130" rx="6" fill="#e3f0e3" stroke="#2e7d32" stroke-width="2"/>
  <text x="205" y="565" text-anchor="middle" font-weight="bold">74AHCT125</text>
  <text x="205" y="584" text-anchor="middle" font-size="11">VCC 5 V (14), GND (7)</text>
  <text x="205" y="600" text-anchor="middle" font-size="11">OE 1, 4, 10, 13 to GND</text>
  <text x="205" y="616" text-anchor="middle" font-size="11">4A (12) to GND</text>
  <text x="205" y="632" text-anchor="middle" font-size="11">100 nF from 14 to 7</text>
  <text x="205" y="655" text-anchor="middle" font-size="11">2→3, 5→6, 9→8</text>

  <!-- ESP32-S3 -->
  <rect x="20" y="230" width="200" height="200" rx="6" fill="#e0ecfb" stroke="#1f5fa8" stroke-width="2"/>
  <text x="120" y="258" text-anchor="middle" font-weight="bold">ESP32-S3-DevKitC-1</text>
  <text x="30" y="290" font-size="12">GPIO11 → 1A (2)</text>
  <text x="30" y="310" font-size="12">GPIO12 → 2A (5)</text>
  <text x="30" y="330" font-size="12">GPIO10 → 3A (9)</text>
  <text x="30" y="355" font-size="12">5V ← 5 V bus through</text>
  <text x="30" y="371" font-size="12">     1N5819 diode</text>
  <text x="30" y="391" font-size="12">G ← GND bus</text>
  <text x="30" y="418" font-size="12">"USB" port ← controller</text>

  <g stroke="#2e7d32" stroke-width="2.5" fill="none">
    <path d="M150 430 V 540"/>
  </g>
  <text x="158" y="490" font-size="11" fill="#2e7d32">3.3 V DIN, CLK, CS</text>
  <g stroke="#2e7d32" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M290 600 H 345 V 455"/>
  </g>
  <text x="360" y="580" font-size="11" fill="#2e7d32">5 V DIN (3), CLK (6), CS (8)</text>
  <text x="360" y="596" font-size="11" fill="#2e7d32">to the IN header of board 1</text>

  <!-- Controller -->
  <rect x="20" y="168" width="150" height="50" rx="6" fill="#efe3f6" stroke="#6a1b9a" stroke-width="2"/>
  <text x="95" y="188" text-anchor="middle" font-weight="bold">USB controller</text>
  <text x="95" y="206" text-anchor="middle" font-size="11">through USB OTG adapter</text>
  <line x1="95" y1="218" x2="95" y2="230" stroke="#6a1b9a" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
