#
# Runs the same commands as scripts/ci.sh, in the ESP-IDF image at the version in
# scripts/esp_idf_version.txt. Keep the image tag in sync with that file.
name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        shell: bash
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          scripts/ci.sh host-tests

  simulator:
    name: Browser simulator
    runs-on: ubuntu-latest
    # Keep the image tag in sync with scripts/emsdk_version.txt.
    container: emscripten/emsdk:6.0.11
    steps:
      - uses: actions/checkout@v4
      - name: Build simulator
        shell: bash
        run: scripts/ci.sh simulator
      - uses: actions/upload-artifact@v4
        with:
          name: simulator
          path: tools/simulator/web
